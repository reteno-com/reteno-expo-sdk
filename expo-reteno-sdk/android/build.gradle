plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.retenosdk'
version = '0.1.0'

// compileSdk / minSdk / targetSdk are applied by expo-module-gradle-plugin from the
// root project's `compileSdkVersion` / `minSdkVersion` / `targetSdkVersion` ext values
// (fallbacks: 36 / 24 / 36), matching the previous manual configuration.

android {
  namespace "expo.modules.retenosdk"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation "androidx.activity:activity-ktx:1.8.2"
  implementation "androidx.fragment:fragment-ktx:1.6.2"
  implementation "com.facebook.react:react-android"
  implementation 'com.reteno:core:2.12.1'
  implementation 'com.reteno:push:2.12.1'
  implementation 'com.reteno:fcm:2.12.1'
  implementation 'com.google.firebase:firebase-messaging:23.1.0'
}
